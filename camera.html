<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SIMANISKU - Kamera Absensi</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#0f172a;color:#fff}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px}
.app{width:100%;max-width:520px;background:#fff;color:#0f172a;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.header{background:#0f172a;color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header h1{margin:0;font-size:18px}.header small{display:block;margin-top:4px;color:#cbd5e1}
.badge{background:#2563eb;color:#fff;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:700}
.content{padding:14px}.camera{position:relative;width:100%;aspect-ratio:3/4;background:#020617;border-radius:16px;overflow:hidden}
video,#preview{width:100%;height:100%;object-fit:cover;display:block}
video.mirror{transform:scaleX(-1)}
#preview{display:none}
.guide{position:absolute;inset:8% 13%;border:2px solid rgba(255,255,255,.85);border-radius:48%;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.15)}
.camera-status{position:absolute;left:10px;right:10px;bottom:10px;padding:9px 11px;background:rgba(15,23,42,.82);color:#fff;border-radius:10px;font-size:12px;text-align:center}
.status{margin-top:10px;padding:11px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px;line-height:1.45}
.status.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}.status.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}.status.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.gps-line{display:flex;justify-content:space-between;gap:10px}.gps-line+.gps-line{margin-top:5px}.label{color:#64748b}.value{font-weight:700;text-align:right}
.buttons{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}
button{border:0;border-radius:12px;padding:13px 14px;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#2563eb;color:#fff}.success{background:#059669;color:#fff}.secondary{background:#e2e8f0;color:#334155}.danger{background:#dc2626;color:#fff}
.hidden{display:none!important}.note{margin-top:10px;color:#64748b;font-size:11px;text-align:center;line-height:1.5}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.invalid{padding:24px;text-align:center;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:14px}
@media(max-width:540px){body{padding:0;align-items:stretch}.app{max-width:none;border-radius:0;min-height:100vh}.content{padding:12px}.camera{aspect-ratio:3/4}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div><h1 id="title">Absen</h1><small>SIMANISKU • Kamera & GPS</small></div>
    <div class="badge" id="typeBadge">MASUK</div>
  </div>
  <div class="content">
    <div id="invalidBox" class="invalid hidden"></div>
    <div id="cameraArea">
      <div class="camera">
        <video id="video" autoplay playsinline muted class="mirror"></video>
        <img id="preview" alt="Preview selfie">
        <div class="guide"></div>
        <div class="camera-status" id="cameraStatus">Menyiapkan sesi kamera...</div>
      </div>

      <div class="status warn" id="gpsStatus">
        <div class="gps-line"><span class="label">GPS</span><span class="value" id="gpsText">Belum aktif</span></div>
        <div class="gps-line"><span class="label">Akurasi</span><span class="value" id="accuracyText">-</span></div>
      </div>

      <div class="buttons">
        <button id="btnStart" class="primary" onclick="startAll()">📷 Aktifkan Kamera & GPS</button>
        <button id="btnCapture" class="primary hidden" onclick="capturePhoto()" disabled>📸 Ambil Foto</button>
        <button id="btnRetake" class="secondary hidden" onclick="retakePhoto()">↻ Ambil Ulang</button>
        <button id="btnSend" class="success hidden" onclick="sendResult()" disabled>✓ Kirim Absen</button>
        <button id="btnClose" class="danger" onclick="closeCamera()">Tutup / Kembali</button>
      </div>

      <div class="note">
        Kompatibel dengan browser modern yang mendukung Camera + GPS (Chrome, Safari, Edge, Firefox, Samsung Internet). Gunakan HTTPS dan izinkan Camera + Location. Akurasi GPS maksimal 1000 meter.
      </div>
    </div>
  </div>
</div>
<canvas id="canvas" class="hidden"></canvas>

<script>
"use strict";

const params = new URLSearchParams(location.search);
const type = String(params.get("type") || "MASUK").toUpperCase() === "PULANG" ? "PULANG" : "MASUK";
const cameraToken = String(params.get("camera_token") || "").trim();
const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycby_9M_FkA1-bWQASLW-WQ65uR8FQs-apRC9eryEYFNcBcDAF2xOEc75HlCAdUvYbLfG/exec";
const apiUrl = String(params.get("api_url") || DEFAULT_API_URL).trim();
const MAX_GPS_ACCURACY = 1000;

let stream = null;
let watchId = null;
let sending = false;
let photoBase64 = null;
let gps = {latitude:null, longitude:null, accuracy:null};
let cameraReady = false;
let gpsPermissionDenied = false;

const $ = id => document.getElementById(id);

$("title").textContent = "Absen " + (type === "MASUK" ? "Masuk" : "Pulang");
$("typeBadge").textContent = type;

function setCameraStatus(text, cls) {
  const el = $("cameraStatus");
  el.textContent = text;
  el.style.background = cls === "err" ? "rgba(127,29,29,.92)" : "rgba(15,23,42,.82)";
}
function setGPSStatus(text, cls) {
  const el = $("gpsStatus");
  el.className = "status " + (cls || "warn");
  $("gpsText").textContent = text;
}
function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => { try { t.stop(); } catch(e) {} });
    stream = null;
  }
  cameraReady = false;
}
function stopGPS() {
  if (watchId !== null && navigator.geolocation) {
    try { navigator.geolocation.clearWatch(watchId); } catch(e) {}
    watchId = null;
  }
}
function gpsReady() {
  return Number.isFinite(gps.latitude) &&
         Number.isFinite(gps.longitude) &&
         Number.isFinite(gps.accuracy) &&
         gps.accuracy >= 0 &&
         gps.accuracy <= MAX_GPS_ACCURACY;
}
function updateCaptureButton() {
  $("btnCapture").disabled = !(cameraReady && gpsReady() && !photoBase64);
}
function showInvalid(message) {
  $("cameraArea").classList.add("hidden");
  $("invalidBox").textContent = message;
  $("invalidBox").classList.remove("hidden");
}
function validSession() {
  if (!cameraToken) return false;
  try {
    const u = new URL(apiUrl);
    return u.protocol === "https:" && u.hostname === "script.google.com";
  } catch(e) {
    return false;
  }
}
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isMobile() {
  return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}
function showStartButton(message) {
  const b = $("btnStart");
  b.classList.remove("hidden");
  b.disabled = false;
  b.textContent = "📷 Aktifkan Kamera & GPS";
  if (message) setCameraStatus(message);
}
async function startCamera() {
  if (!window.isSecureContext) {
    throw new Error("Kamera membutuhkan HTTPS. Buka halaman kamera dari GitHub Pages HTTPS.");
  }
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
    throw new Error("Browser ini tidak menyediakan akses kamera untuk halaman web.");
  }

  setCameraStatus("Meminta izin kamera...");
  const constraints = [
    {video:{facingMode:{exact:"user"},width:{ideal:1280},height:{ideal:720}},audio:false},
    {video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false},
    {video:{width:{ideal:1280},height:{ideal:720}},audio:false},
    {video:true,audio:false}
  ];

  let lastError = null;
  for (const c of constraints) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(c);
      break;
    } catch(e) {
      lastError = e;
      stream = null;
    }
  }

  if (!stream) {
    const n = lastError && lastError.name;
    if (n === "NotAllowedError" || n === "PermissionDeniedError") {
      throw new Error("Izin kamera ditolak. Izinkan Camera untuk situs GitHub Pages SIMANISKU, lalu tekan tombol aktivasi lagi.");
    }
    if (n === "NotFoundError" || n === "DevicesNotFoundError") {
      throw new Error("Kamera tidak ditemukan pada perangkat.");
    }
    if (n === "NotReadableError" || n === "TrackStartError") {
      throw new Error("Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera lain lalu coba lagi.");
    }
    if (n === "SecurityError") {
      throw new Error("Browser memblokir kamera karena keamanan halaman.");
    }
    throw new Error("Kamera gagal dibuka" + (n ? " (" + n + ")" : "") + ".");
  }

  const video = $("video");
  video.srcObject = stream;
  video.muted = true;
  video.autoplay = true;
  video.playsInline = true;
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");
  video.setAttribute("autoplay", "");
  video.classList.add("mirror");

  try { await video.play(); } catch(e) {}

  await new Promise(resolve => {
    if (video.readyState >= 2) return resolve();
    const done = () => { video.removeEventListener("loadedmetadata", done); resolve(); };
    video.addEventListener("loadedmetadata", done);
    setTimeout(resolve, 1500);
  });

  cameraReady = !!stream;
  $("btnStart").classList.add("hidden");
  $("btnCapture").classList.remove("hidden");
  setCameraStatus("Kamera aktif • arahkan wajah ke dalam bingkai.");
  updateCaptureButton();
}
function startGPS() {
  if (!navigator.geolocation) {
    setGPSStatus("Browser tidak mendukung GPS/geolocation.", "err");
    return;
  }
  if (watchId !== null) return;

  setGPSStatus("Meminta izin lokasi & mencari GPS...", "warn");
  watchId = navigator.geolocation.watchPosition(
    pos => {
      gps.latitude = Number(pos.coords.latitude);
      gps.longitude = Number(pos.coords.longitude);
      gps.accuracy = Number(pos.coords.accuracy);

      $("accuracyText").textContent =
        Number.isFinite(gps.accuracy) ? Math.round(gps.accuracy) + " meter" : "-";

      if (gpsReady()) {
        setGPSStatus("GPS terkunci", "ok");
      } else {
        setGPSStatus("GPS ditemukan, akurasi belum memenuhi syarat (≤ " + MAX_GPS_ACCURACY + " m)", "warn");
      }
      updateCaptureButton();
    },
    err => {
      if (err.code === 1) {
        gpsPermissionDenied = true;
        setGPSStatus("Izin lokasi ditolak. Aktifkan Location untuk situs kamera SIMANISKU.", "err");
      } else if (err.code === 2) {
        setGPSStatus("Lokasi tidak tersedia. Aktifkan Location/GPS perangkat.", "err");
      } else if (err.code === 3) {
        setGPSStatus("GPS timeout. Tetap aktifkan GPS lalu tekan coba lagi.", "err");
      } else {
        setGPSStatus("GPS gagal mendapatkan lokasi.", "err");
      }
      updateCaptureButton();
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 30000
    }
  );
}
async function startAll() {
  if (sending) return;

  $("btnStart").disabled = true;
  $("btnStart").textContent = "Mengaktifkan...";

  let cameraError = null;
  try {
    await startCamera();
  } catch(e) {
    cameraError = e;
    showStartButton(e.message || "Kamera belum dapat diaktifkan.");
  }

  // GPS is intentionally independent from camera permission.
  startGPS();

  if (!cameraError && gpsReady()) {
    setCameraStatus("Kamera & GPS siap.");
  } else if (!cameraError) {
    setCameraStatus("Kamera aktif. Menunggu GPS...");
  }
}
function capturePhoto() {
  if (!cameraReady || !stream) {
    alert("Kamera belum siap.");
    return;
  }
  if (!gpsReady()) {
    alert("GPS belum siap atau akurasi masih lebih dari " + MAX_GPS_ACCURACY + " meter.");
    return;
  }

  const video = $("video");
  if (!video.videoWidth || !video.videoHeight) {
    alert("Kamera belum siap. Tunggu sebentar.");
    return;
  }

  const canvas = $("canvas");
  const maxWidth = 900;
  const scale = Math.min(1, maxWidth / video.videoWidth);
  canvas.width = Math.max(1, Math.round(video.videoWidth * scale));
  canvas.height = Math.max(1, Math.round(video.videoHeight * scale));

  const ctx = canvas.getContext("2d", {alpha:false});
  ctx.save();
  // Preview is mirrored, so save a natural-looking selfie orientation.
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.restore();

  photoBase64 = canvas.toDataURL("image/jpeg", 0.72);
  $("preview").src = photoBase64;
  $("preview").style.display = "block";
  video.style.display = "none";

  stopCamera();

  $("btnCapture").classList.add("hidden");
  $("btnRetake").classList.remove("hidden");
  $("btnSend").classList.remove("hidden");
  $("btnSend").disabled = false;
  setCameraStatus("Foto siap • GPS " + Math.round(gps.accuracy) + " meter.");
}
async function retakePhoto() {
  photoBase64 = null;
  $("preview").style.display = "none";
  $("video").style.display = "block";
  $("btnRetake").classList.add("hidden");
  $("btnSend").classList.add("hidden");
  $("btnCapture").classList.remove("hidden");
  $("btnCapture").disabled = true;

  try {
    await startCamera();
  } catch(e) {
    showStartButton(e.message || "Kamera gagal dibuka. Tekan aktivasi.");
  }
}
function sendResult() {
  if (sending) return;
  if (!validSession()) {
    alert("Sesi kamera tidak valid. Buka kamera dari tombol Absen di SIMANISKU.");
    return;
  }
  if (!photoBase64) {
    alert("Ambil foto selfie terlebih dahulu.");
    return;
  }
  if (!gpsReady()) {
    alert("GPS belum memenuhi syarat akurasi maksimal " + MAX_GPS_ACCURACY + " meter.");
    return;
  }

  sending = true;
  stopCamera();
  stopGPS();

  const btn = $("btnSend");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Mengirim & menyimpan...';
  setCameraStatus("Mengirim selfie + GPS ke SIMANISKU...");

  const form = document.createElement("form");
  form.method = "POST";
  form.action = apiUrl;
  form.style.display = "none";

  const fields = {
    camera_token: cameraToken,
    type: type,
    latitude: String(gps.latitude),
    longitude: String(gps.longitude),
    accuracy: String(gps.accuracy),
    foto_base64: photoBase64
  };

  Object.keys(fields).forEach(name => {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = name;
    input.value = fields[name];
    form.appendChild(input);
  });

  document.body.appendChild(form);
  form.submit();
}
function closeCamera() {
  stopCamera();
  stopGPS();
  if (history.length > 1) {
    history.back();
  } else {
    location.replace("https://gfauqi.github.io/simanisku-camera/");
  }
}
async function diagnostics() {
  if (!navigator.permissions || !navigator.permissions.query) return;
  try {
    const cameraPermission = await navigator.permissions.query({name:"camera"});
    if (cameraPermission.state === "denied") {
      setCameraStatus("Izin Camera ditolak untuk situs ini. Buka Site settings → Camera → Allow.", "err");
    }
  } catch(e) {}
  try {
    const locationPermission = await navigator.permissions.query({name:"geolocation"});
    if (locationPermission.state === "denied") {
      setGPSStatus("Izin Location ditolak. Buka Site settings → Location → Allow.", "err");
    }
  } catch(e) {}
}
function bootstrap() {
  if (!validSession()) {
    showInvalid("Sesi kamera tidak valid atau sudah tidak tersedia. Kembali ke SIMANISKU dan tekan Absen " + (type === "MASUK" ? "Masuk" : "Pulang") + " lagi.");
    return;
  }

  if (!window.isSecureContext) {
    showInvalid("Halaman kamera harus dibuka melalui HTTPS.");
    return;
  }

  diagnostics();

  // Browser-independent: try automatically. If the browser/OS requires a
  // user gesture, the button remains visible and one tap retries permission.
  setTimeout(() => startAll(), 300);
}
window.addEventListener("load", bootstrap);
window.addEventListener("pageshow", () => {
  if (!cameraReady && !sending) setTimeout(() => diagnostics(), 250);
});
window.addEventListener("pagehide", () => {
  stopCamera();
  stopGPS();
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !sending) {
    diagnostics();
    if (!cameraReady && !photoBase64) {
      setTimeout(() => {
        // Do not spam permission dialogs; user can press the button if needed.
        updateCaptureButton();
      }, 250);
    }
  }
});
</script>
</body>
</html>
